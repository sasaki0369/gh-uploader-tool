<style>
:root{
  --ink:#111;--ink2:#555;--ink3:#aaa;--rule:#e4e4e4;--bg:#fafaf8;
  --accent:#d63800;--mono:'DM Mono',monospace;
  --sans:'Noto Sans JP',-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--sans);background:var(--bg);min-height:100vh;color:var(--ink)}
button,input,textarea,select{font-family:var(--sans)}
button{cursor:pointer}
button:active{opacity:.75}
input:focus,textarea:focus{outline:none}
#app{min-height:100vh;display:flex;flex-direction:column}

/* ── AppBar ── */
.appbar{background:var(--ink);color:white;padding:13px 18px;font-size:15px;font-weight:300;letter-spacing:.05em;flex-shrink:0;position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between}
.appbar-title{font-size:15px;font-weight:400;color:rgba(255,255,255,.7);letter-spacing:.04em}
.appbar-right{font-family:var(--mono);font-size:15px;color:rgba(255,255,255,.45);letter-spacing:.04em}

/* ── Tabs ── */
.tabs{display:flex;background:white;border-bottom:1px solid var(--rule);flex-shrink:0;position:sticky;top:43px;z-index:40}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;padding:11px 0;gap:5px;font-size:13px;font-weight:400;color:var(--ink3);border-bottom:2px solid transparent;letter-spacing:.06em}
.tab.active{color:var(--ink);border-bottom-color:var(--ink)}
.tab svg{width:20px;height:20px;stroke:currentColor;stroke-width:1.5;fill:none}

/* ── Status bar ── */
.status-bar{background:white;padding:8px 18px;border-bottom:1px solid var(--rule);font-size:14px;color:var(--ink3);display:flex;align-items:center;gap:7px;flex-shrink:0;position:sticky;top:92px;z-index:35;letter-spacing:.04em}
.status-dot{width:6px;height:6px;border-radius:50%}
.status-dot.running{background:#3a7;animation:pulse 2s infinite}
.status-dot.paused{background:#c80}
.status-dot.emergency{background:var(--accent);animation:pulse .8s infinite}
.status-dot.waiting{background:var(--ink3)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes spin{to{transform:rotate(360deg)}}
@-webkit-keyframes spin{to{-webkit-transform:rotate(360deg)}}

/* ── Content ── */
.content{flex:1;overflow-y:auto}

/* ── Cards (準備タブ用) ── */
.section-title{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:12px;letter-spacing:.03em}
.card{background:white;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:16px 18px;margin-bottom:8px}
.field-label{font-size:12px;color:var(--ink3);margin-bottom:6px;font-weight:400;letter-spacing:.1em;text-transform:uppercase}
.field-inp{width:100%;border:none;border-bottom:1.5px solid var(--rule);background:transparent;padding:10px 0;font-size:18px;color:var(--ink)}
.field-inp:focus{border-bottom-color:var(--ink)}

/* ── Buttons ── */
.btn{border:none;border-radius:4px;font-weight:400;cursor:pointer;letter-spacing:.04em;transition:opacity .1s}
.btn-primary{background:var(--ink);color:white;padding:13px 22px;font-size:15px}
.btn-outline{background:white;border:1px solid var(--ink);color:var(--ink);padding:11px 18px;font-size:14px}
.btn-green{background:#2e5;color:white;padding:11px 18px;font-size:14px}
.btn-danger{background:var(--accent);color:white;padding:11px 18px;font-size:14px}
.btn-amber{background:#c80;color:white;padding:11px 18px;font-size:14px}
.btn-gray{background:#eee;color:var(--ink2);padding:11px 18px;font-size:14px;border:1px solid var(--rule)}
.btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}

/* ── CSV info ── */
.csv-info{font-size:12px;color:var(--ink2);line-height:2;padding:12px;background:#f5f5f3;border-radius:4px}
.csv-info b{color:var(--ink)}

/* ── Share ── */
.qr-wrap{text-align:center;padding:10px 0}
.qr-wrap img{border-radius:8px;border:1px solid var(--rule);max-width:160px}

/* ── Recovery ── */
.recovery-row{display:flex;gap:8px;align-items:center}
.recovery-inp{flex:1;border:1px solid var(--rule);border-radius:4px;padding:10px 14px;font-size:15px;background:white}

/* ── Progress (進行タブ) ── */
.prog-header{padding:16px 18px 0;display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:6px}
.prog-title{font-size:16px;font-weight:700;color:var(--ink);letter-spacing:.03em}
.ctrl-row{display:flex;gap:8px;flex-wrap:wrap;padding:12px 18px 10px;border-bottom:1px solid var(--rule)}

/* ── Section label ── */
.section-label{padding:16px 18px 6px;font-size:12px;color:var(--ink3);letter-spacing:.12em;text-transform:uppercase;border-bottom:1px solid var(--rule);scroll-margin-top:140px}

/* ── Program row (深津スタイル) ── */
.prog-row{display:grid;grid-template-columns:52px 1fr auto 28px;align-items:center;min-height:76px;padding:14px 18px;border-bottom:1px solid var(--rule);gap:10px;background:white;transition:background .1s;position:relative}
.prog-row.done-row{background:#f7fdf6}
.prog-row.estimated-row{background:repeating-linear-gradient(135deg,#f7f7f7 0px,#f7f7f7 6px,#fafafa 6px,#fafafa 12px);opacity:.8}

function el(tag,attrs,ch){

  if(attrs){Object.keys(attrs).forEach(function(k){
    if(k==='style'&&typeof attrs[k]==='object'){Object.assign(e.style,attrs[k]);}

  });}

function uid(){return Math.random().toString(36).slice(2,9);}

function parseHash(){

    var h=location.hash.slice(1);if(!h)return{mode:'admin'};

function fmtDate(d){if(!(d instanceof Date)||isNaN(d))return'';return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function fmtISO(iso){if(!iso)return'';try{return fmtDate(new Date(iso));}catch(e){return'';}}
function parseTimeToMs(t){try{if(!t||typeof t!=='string')return 0;var p=t.split(':');if(p.length<2)return 0;var ms=(+p[0]*60+ +p[1])*60000;return isNaN(ms)?0:ms;}catch(e){return 0;}}
function diffMin(isoA,isoB){return Math.round((new Date(isoA)-new Date(isoB))/60000);}

function csvParse(text){
  var lines=text.trim().split('\n').filter(Boolean);
  // 1行目はヘッダー行としてスキップ
  return lines.slice(1).map(function(line){
    var cols=line.split(',').map(function(s){return s.trim().replace(/^"|"$/g,'');});
    // 列構成: 時刻, 対象, プログラム[, 注目イベントメモ]
    // ※プログラム名自体にカンマが入る場合を考慮し、最後の列を注目メモとして扱う
    var noteCol=cols.length>=4?cols[cols.length-1]:'';
    var progCols=cols.length>=4?cols.slice(2,cols.length-1):cols.slice(2);
    var prog=progCols.join(',').trim();
    var isFeatured=!!noteCol;
    return{
      id:uid(),scheduledTime:cols[0]||'',target:cols[1]||'',program:prog,
      status:'pending',startedAt:null,operatorName:null,
      isFeatured:isFeatured,
      featuredNote:isFeatured?noteCol:'',
      featuredAt:isFeatured?new Date().toISOString():null
    };
  }).filter(function(p){return p.program||p.target;});
}
// 文字コード自動判定（UTF-8 → Shift-JIS フォールバック）
function readCsvFile(file,callback){
  var reader=new FileReader();
  reader.onload=function(e){
    var buf=e.target.result;
    var utf8=null;
    try{utf8=new TextDecoder('utf-8',{fatal:true}).decode(buf);}catch(err){utf8=null;}
    if(utf8){callback(utf8);return;}
    // Shift-JIS にフォールバック
    try{callback(new TextDecoder('shift-jis').decode(buf));}
    catch(err2){callback(new TextDecoder('utf-8',{fatal:false}).decode(buf));}
  };
  reader.readAsArrayBuffer(file);
}

// FirebaseはJS配列をオブジェクトで返す場合がある→Array化
function toArray(val){
  if(!val)return[];
  if(Array.isArray(val))return val;
  // objectのvaluesを返す（indexでソート）
  return Object.keys(val).sort(function(a,b){return Number(a)-Number(b);}).map(function(k){return val[k];});
}

function estimateAll(programs){
  var ps=toArray(programs).map(function(p,i){return Object.assign({},p,{_i:i});});
  var done=ps.filter(function(p){return p.startedAt;}).sort(function(a,b){return a._i-b._i;});

  // 開始済みなし → 予定時刻をそのまま表示
  if(done.length===0){
    return ps.map(function(p){return Object.assign({},p,{_est:p.scheduledTime||'--:--'});});
  }

  // 直前（最後）に開始されたプログラムのズレをそのまま全行に適用
  var last=done[done.length-1];
  var schedMs=parseTimeToMs(last.scheduledTime);
  var actualMs=new Date(last.startedAt).getHours()*3600000+new Date(last.startedAt).getMinutes()*60000;
  var offsetMs=schedMs?actualMs-schedMs:0;

  return ps.map(function(p){
    if(p.startedAt)return Object.assign({},p,{_est:fmtISO(p.startedAt)});
    if(!p.scheduledTime)return Object.assign({},p,{_est:'--:--'});
    var ms=parseTimeToMs(p.scheduledTime)+offsetMs;
    return Object.assign({},p,{_est:fmtDate(new Date(new Date().setHours(0,0,0,0)+ms))});
  });
}

function showStartConfirm(programName, scheduledTime, onConfirm){
  var now=new Date();

  modal.appendChild(el('div',{style:{fontSize:11,color:'#94a3b8',fontWeight:'600',marginBottom:8}},'開始時刻（必要なら修正してください）'));

  var digitWrap=el('div',{style:{display:'flex',alignItems:'center',gap:2}});
  var hDisp=el('div',{style:{fontSize:38,fontWeight:900,fontFamily:'monospace',padding:'4px 8px',borderRadius:8,cursor:'pointer',minWidth:54,textAlign:'center'}});
  var colonEl=el('div',{style:{fontSize:38,fontWeight:900,fontFamily:'monospace',color:'#1a1a2e'}},':');
  var mDisp=el('div',{style:{fontSize:38,fontWeight:900,fontFamily:'monospace',padding:'4px 8px',borderRadius:8,cursor:'pointer',minWidth:54,textAlign:'center'}});
  digitWrap.appendChild(hDisp);digitWrap.appendChild(colonEl);digitWrap.appendChild(mDisp);
  var ampmWrap=el('div',{style:{display:'flex',flexDirection:'column',gap:4}});
  var amBtn=el('button',{style:{border:'2px solid #5b4fcf',borderRadius:8,padding:'5px 10px',fontSize:13,fontWeight:'800',cursor:'pointer',width:50}},'AM');
  var pmBtn=el('button',{style:{border:'2px solid #5b4fcf',borderRadius:8,padding:'5px 10px',fontSize:13,fontWeight:'800',cursor:'pointer',width:50}},'PM');
  ampmWrap.appendChild(amBtn);ampmWrap.appendChild(pmBtn);
  topRow.appendChild(digitWrap);topRow.appendChild(ampmWrap);
  modal.appendChild(topRow);
  function dispH12(){var h=selH%12;return h===0?12:h;}
  function updateDisplay(){
    hDisp.textContent=String(selH).padStart(2,'0');
    mDisp.textContent=String(selM).padStart(2,'0');
    hDisp.style.background=mode==='hour'?'#ede7ff':'transparent';
    hDisp.style.color=mode==='hour'?'#5b4fcf':'#1a1a2e';
    mDisp.style.background=mode==='minute'?'#ede7ff':'transparent';
    mDisp.style.color=mode==='minute'?'#5b4fcf':'#94a3b8';
    amBtn.style.background=isAM?'#5b4fcf':'white';amBtn.style.color=isAM?'white':'#5b4fcf';
    pmBtn.style.background=!isAM?'#5b4fcf':'white';pmBtn.style.color=!isAM?'white':'#5b4fcf';
  }
  amBtn.onclick=function(){if(!isAM){isAM=true;selH=selH>=12?selH-12:selH;}updateDisplay();};
  pmBtn.onclick=function(){if(isAM){isAM=false;selH=selH<12?selH+12:selH;}updateDisplay();};
  hDisp.onclick=function(){mode='hour';updateDisplay();drawClock();};
  mDisp.onclick=function(){mode='minute';updateDisplay();drawClock();};
  var SVG_SIZE=220,CX=110,CY=110,R=93;
  var svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('width',SVG_SIZE);svg.setAttribute('height',SVG_SIZE);svg.setAttribute('viewBox','0 0 '+SVG_SIZE+' '+SVG_SIZE);
  svg.style.display='block';svg.style.margin='0 auto';svg.style.touchAction='none';svg.style.cursor='pointer';
  function drawClock(){
    svg.innerHTML='';
    var bgc=document.createElementNS('http://www.w3.org/2000/svg','circle');
    bgc.setAttribute('cx',CX);bgc.setAttribute('cy',CY);bgc.setAttribute('r',R);bgc.setAttribute('fill','#f1f5f9');svg.appendChild(bgc);

      var nx=CX+Math.cos(a)*(R-22),ny=CY+Math.sin(a)*(R-22);
      var isSel=mode==='hour'?dispH12()===n:(n===Math.round(selM/5)*5%60);

        cd.setAttribute('cx',CX);cd.setAttribute('cy',CY);cd.setAttribute('r',5);cd.setAttribute('fill','#5b4fcf');svg.appendChild(cd);
        var sc=document.createElementNS('http://www.w3.org/2000/svg','circle');
        sc.setAttribute('cx',nx);sc.setAttribute('cy',ny);sc.setAttribute('r',20);sc.setAttribute('fill','#5b4fcf');svg.appendChild(sc);

      tx.setAttribute('x',nx);tx.setAttribute('y',ny);tx.setAttribute('text-anchor','middle');tx.setAttribute('dominant-baseline','central');
      tx.setAttribute('font-size','14');tx.setAttribute('font-weight','700');tx.setAttribute('fill',isSel?'white':'#1a1a2e');
      tx.textContent=mode==='hour'?String(n):String(n).padStart(2,'0');svg.appendChild(tx);

    if(mode==='hour'){

// ══ Firebase設定完了 → 設定済みHTML生成画面 ══
function mountFbDownload(cfg, onDone){
  var dlBtn=el('button',{className:'btn btn-primary',style:{width:'100%',padding:'16px',fontSize:15,marginBottom:12}},'📥 設定済み index.html をダウンロード');
  dlBtn.onclick=function(){
    dlBtn.disabled=true;dlBtn.textContent='⏳ ダウンロード中…';
    // 同一オリジンのHTMLを取得してConfig差し替え（Safari対応）
    var pageUrl=location.href.split('#')[0].split('?')[0];
    fetch(pageUrl,{cache:'no-store'})
      .then(function(r){
        if(!r.ok)throw new Error('HTTP '+r.status);
        return r.text();
      })
      .then(function(src){
        var ph='var __EMBEDDED_CFG__=null; // EVTM_EMBEDDED_CFG';
        var cs='var __EMBEDDED_CFG__='+JSON.stringify(cfg)+'; // EVTM_EMBEDDED_CFG';
        if(src.indexOf(ph)<0){
          throw new Error('プレースホルダが見つかりません。先に最新版をtiinyにアップしてください');
        }
        var configured=src.split(ph).join(cs);
        var blob=new Blob([configured],{type:'text/html;charset=utf-8'});
        var a=document.createElement('a');
        a.href=URL.createObjectURL(blob);
        a.download='index.html';
        document.body.appendChild(a);a.click();document.body.removeChild(a);
        setTimeout(function(){try{URL.revokeObjectURL(a.href);}catch(e){}},3000);
        dlBtn.textContent='✅ ダウンロード完了！tiinyに再アップしてください';
        dlBtn.style.background='#2e7d32';dlBtn.disabled=false;
      })
      .catch(function(e){
        dlBtn.textContent='❌ '+String(e.message||e);
        dlBtn.style.background='#dc2626';dlBtn.disabled=false;
      });
  };

  var nextBtn=el('button',{className:'btn',style:{width:'100%',padding:'14px',background:'#f0eef8',color:'#5b4fcf',fontSize:14,borderRadius:12,border:'none',cursor:'pointer',marginTop:10}},'→ このまま使い始める（この端末のみ設定済み）');
  nextBtn.onclick=onDone;

  render(el('div',{style:{minHeight:'100vh',background:'linear-gradient(135deg,#f0eef8,#f0fdf4)',display:'flex',flexDirection:'column'}},[
    el('div',{className:'appbar',style:{background:'#2e7d32'}},'✅ Firebase 接続成功'),
    el('div',{style:{maxWidth:480,margin:'0 auto',padding:'20px 16px',width:'100%'}},[
      el('div',{className:'card',style:{borderColor:'#a7f3d0'}},[
        el('div',{style:{fontSize:15,fontWeight:'800',color:'#1a1a2e',marginBottom:8}},'すべての端末でConfig不要にするには'),
        el('div',{style:{fontSize:13,color:'#475569',lineHeight:'1.8',marginBottom:16}},[
          '① 下のボタンで',el('b',null,'index.html'),'をダウンロード',el('br'),
          '② tiiny.hostにこのファイルをドロップして再アップ',el('br'),
          el('span',{style:{fontSize:11,color:'#94a3b8'}},'以降はiPad・Androidどの端末もConfig不要になります'),
        ]),
        dlBtn,
        el('div',{style:{background:'#fffbeb',borderRadius:10,padding:'12px',fontSize:12,color:'#92400e',margin:'10px 0'}},[
          '⚠️ tiiny.hostではZIP不要。ダウンロードした',el('b',null,'index.html'),'をそのままドロップでOK',
        ]),
        nextBtn,
      ]),
    ]),
  ]));
}

      try{cfg=JSON.parse(jsObjToJson(raw));}catch(e2){errEl.textContent='形式エラー: '+e2.message;errEl.style.display='';return;}
    }
    if(!cfg.databaseURL){errEl.textContent='"databaseURL" がありません。Realtime Database を先に作成してください。';errEl.style.display='';return;}
    if(!initFb(cfg)){errEl.textContent='Firebase初期化失敗。設定を確認してください。';errEl.style.display='';return;}
    saveCfg(cfg);
    mountFbDownload(cfg, onDone);
  };
  var resetLink=el('span',{style:{fontSize:11,color:'#94a3b8',cursor:'pointer',textDecoration:'underline'}},'設定をリセット');
  resetLink.onclick=function(){showConfirm('Firebase設定を削除して再設定しますか？',function(){localStorage.removeItem(fbCfgKey());location.reload();});};

  render(el('div',{style:{minHeight:'100vh',background:'linear-gradient(135deg,#f0eef8,#fff7ed)'}},[
    el('div',{className:'appbar'},'🔥 Firebase 初期設定'),
    el('div',{className:'setup-wrap'},[
      el('div',{className:'card'},[
        el('div',{className:'section-title'},'手順'),
        step(1,'Firebaseプロジェクトを作成',el('div',{className:'step-desc'},[el('a',{href:'https://console.firebase.google.com',target:'_blank',rel:'noopener',style:{color:'#5b4fcf',fontWeight:'700'}},'console.firebase.google.com'),' → 「プロジェクトを追加」'])),
        step(2,'Realtime Databaseを有効化',el('div',{className:'step-desc'},'左メニュー「構築/ビルド」→「Realtime Database」→「データベースを作成」→「テストモード」')),
        step(3,'設定をコピー',el('div',{className:'step-desc'},'プロジェクト設定（⚙️）→「マイアプリ」→「</> ウェブ」→「Config」→ { } をコピー')),
      ]),
      el('div',{className:'card'},[
        el('div',{className:'section-title'},'firebaseConfig を貼り付け'),
        el('div',{style:{fontSize:12,color:'#94a3b8',marginBottom:8}},'JSON形式・JS形式どちらも貼り付け可能'),
        ta,errEl,btn,
        el('div',{style:{textAlign:'right',marginTop:12}},resetLink),
      ]),
    ]),
  ]));
}

// ══ ② メインアプリ ══
function mountMain(initState, role, opKey, initialTab){
  clearTimers();
  var state=initState;
  var canEdit=(role!=='viewer');
  var activeTab=initialTab||(canEdit?'setup':'progress');
  if(role==='operator'||role==='viewer')activeTab='progress';
  var opName=role==='admin'?(initState.adminName||'運営管理者'):(initState.adminName||'運営管理者');

  // root
  var root=el('div',{style:{minHeight:'100vh',display:'flex',flexDirection:'column'}});

  // appbar - 深津スタイル：イベント名 + 時刻
  function tickClock(){if(clockEl)clockEl.textContent=fmtDate(new Date());}
  // イベント切替パネル
  function showEventSwitcher(){
    var list=getEventsList();
    var bg=el('div',{className:'modal-bg',style:{alignItems:'flex-end'}});
    var modal=el('div',{className:'modal',style:{maxWidth:520,paddingBottom:24}});
    modal.appendChild(el('div',{style:{fontSize:12,color:'var(--ink3)',letterSpacing:'.1em',marginBottom:14}},'イベントを切り替え'));

    list.forEach(function(evt){
      var isActive=evt.eventId===state.eventId;
      var row=el('div',{style:{
        display:'flex',alignItems:'center',gap:12,padding:'13px 0',
        borderBottom:'1px solid var(--rule)',cursor:isActive?'default':'pointer',
        opacity:isActive?1:.85
      }});
      var dot=el('div',{style:{width:8,height:8,borderRadius:'50%',flexShrink:0,
        background:isActive?'var(--accent)':'var(--rule)'}});
      var info=el('div',{style:{flex:1,minWidth:0}});
      info.appendChild(el('div',{style:{fontSize:16,fontWeight:isActive?700:400,color:'var(--ink)',
        overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},
        evt.eventName||'（無題）'));
      info.appendChild(el('div',{style:{fontSize:11,color:'var(--ink3)',marginTop:2,fontFamily:'var(--mono)'}},evt.eventId));
      var badge=isActive?el('span',{style:{fontSize:11,color:'var(--accent)',fontWeight:700}},'表示中'):el('span');
      row.appendChild(dot);row.appendChild(info);row.appendChild(badge);
      if(!isActive){
        row.onclick=function(){
          document.body.removeChild(bg);
          var spin=el('div',{style:{minHeight:'100vh',display:'flex',flexDirection:'column',
            alignItems:'center',justifyContent:'center',gap:14,background:'var(--bg)'}});
          spin.appendChild(el('div',{className:'spinner'}));
          spin.appendChild(el('div',{style:{fontSize:14,fontWeight:700,color:'var(--ink2)'}},evt.eventName||'読み込み中…'));
          render(spin);
          localStorage.setItem(EVT_ACTIVE_KEY,evt.eventId);
          dbLoad(evt.eventId,function(err,s){
            if(!err&&s){clearTimers();mountMain(s,'admin',null,activeTab);}
            else{showSnackbar('読み込み失敗: '+evt.eventName);mountMain(state,role,opKey,activeTab);}
          });
        };
      }
      modal.appendChild(row);
    });

    var newBtn=el('button',{className:'btn btn-primary',style:{width:'100%',marginTop:16,padding:'12px',fontSize:14}},'＋ 新規イベントを作成');
    newBtn.onclick=function(){document.body.removeChild(bg);clearTimers();showSetupForm(null);};
    modal.appendChild(newBtn);
    bg.appendChild(modal);
    bg.onclick=function(e){if(e.target===bg&&document.body.contains(bg))document.body.removeChild(bg);};
    document.body.appendChild(bg);
  }

  var appbar=el('div',{className:'appbar'},[
    el('div',{style:{display:'flex',alignItems:'center',gap:5,cursor:'pointer',flex:1,minWidth:0},onclick:role==='admin'?showEventSwitcher:null},[
      el('span',{className:'appbar-title',id:'appbar-title-el',style:{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},state.eventName||'イベントNow！'),
      role==='admin'?el('span',{style:{fontSize:11,opacity:.5,flexShrink:0}},'▾'):el('span'),
    ]),
    el('span',{id:'hdr-clock',className:'appbar-right'},fmtDate(new Date())),
  ]);
  root.appendChild(appbar);

  // tabs
  var tabs=el('div',{className:'tabs'});
  var tabSetup=el('div',{className:'tab'},[ svgIcon('setup'),' 準備']);
  var tabProg=el('div',{className:'tab'},[ svgIcon('list'),' 進行']);
  if(role==='admin'){tabs.appendChild(tabSetup);tabs.appendChild(tabProg);}
  else{tabs.appendChild(tabProg);}
  root.appendChild(tabs);

  // status bar - ステータスドット＋テキストのみ
  var statusBar=el('div',{className:'status-bar'});
  var statusDot=el('span',{className:'status-dot waiting'});
  var statusText=el('span',{});
  var clockEl=document.getElementById('hdr-clock');
  if(role==='viewer')statusBar.appendChild(el('span',{className:'viewer-chip'},'閲覧'));
  statusBar.appendChild(statusDot);statusBar.appendChild(statusText);
  root.appendChild(statusBar);

  // emergency/pause overlay
  var overlayEl=el('div',{style:{display:'none'}});
  root.appendChild(overlayEl);

  // content area
  var content=el('div',{className:'content'});
  root.appendChild(content);

  // ── Setup Tab ──
  var setupTabEl=null;

  function buildSetupTab(){
    var base=getBase();
    var viewUrl=base+'#view:'+state.eventId;
    var opUrl=base+'#op:'+state.eventId+':'+state.opKey;

    // シェア画面モーダル
    function showShareModal(title,url,desc){
      var bg=el('div',{className:'modal-bg',style:{alignItems:'flex-end'}});
      var modal=el('div',{className:'modal'});
      var closeModal=function(){if(document.body.contains(bg))document.body.removeChild(bg);};
      bg.onclick=function(e){if(e.target===bg)closeModal();};

      var inpShare=el('input',{style:{width:'100%',fontSize:11,border:'1px solid #e0ddf0',borderRadius:8,padding:'8px 10px',background:'#f8f7ff',fontFamily:'monospace',marginBottom:12}});
      inpShare.value=url;inpShare.readOnly=true;

      var copyBtn=el('button',{className:'btn btn-primary',style:{width:'100%',marginBottom:10}},'📋 URLをコピー');
      copyBtn.onclick=function(){
        try{navigator.clipboard.writeText(url);}catch(e){var t=document.createElement('textarea');t.value=url;document.body.appendChild(t);t.select();document.execCommand('copy');document.body.removeChild(t);}
        copyBtn.textContent='✓ コピーしました';
        setTimeout(function(){copyBtn.textContent='📋 URLをコピー';},2000);
      };

      var nativeBtn=null;
      if(navigator.share){
        nativeBtn=el('button',{className:'btn btn-outline',style:{width:'100%',marginBottom:10}},'↗ 共有メニューを開く');
        nativeBtn.onclick=function(){navigator.share({title:'イベントNow！ '+title,url:url}).catch(function(){});};
      }

      var qrDiv=el('div',{className:'qr-wrap',style:{marginBottom:12}},
        el('img',{src:'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data='+encodeURIComponent(url)+'&bgcolor=f8f7ff&color=1a1a2e&margin=8',alt:'QR',style:{maxWidth:200,borderRadius:10,border:'2px solid #e0ddf0'}})
      );

      var closeBtn=el('button',{className:'btn',style:{width:'100%',background:'#f0eef8',color:'#5b4fcf',padding:'12px',marginTop:4}},'閉じる');
      closeBtn.onclick=closeModal;

      modal.appendChild(el('div',{className:'modal-title'},title));
      modal.appendChild(el('div',{className:'modal-sub'},desc));
      modal.appendChild(inpShare);
      modal.appendChild(copyBtn);
      if(nativeBtn)modal.appendChild(nativeBtn);
      modal.appendChild(qrDiv);
      modal.appendChild(closeBtn);
      bg.appendChild(modal);
      document.body.appendChild(bg);
    }

    // CSV再読み込み（イベントIDは変えない・開始済みをマージ）
    var csvReMsg=el('div',{style:{fontSize:13,color:'#2e7d32',fontWeight:'600',marginTop:8}},
      state.programs&&state.programs.length?'現在 '+state.programs.length+'件':'');
    var csvReFileInp=el('input',{type:'file',accept:'.csv,.txt',style:{display:'none'}});
    var csvReBtn=el('button',{className:'btn btn-outline',style:{width:'100%',marginTop:8}},'📂 CSVを再読み込み');
    csvReBtn.onclick=function(){csvReFileInp.click();};
    csvReFileInp.onchange=function(){
      var f=csvReFileInp.files[0];if(!f)return;
      csvReFileInp.value=''; // 同じファイルを再選択できるようリセット
      var baseName=f.name.replace(/\.[^.]+$/,'');
      function doLoad(changeEventName){
        readCsvFile(f,function(text){
        var newProgs=csvParse(text);
        if(!newProgs.length){csvReMsg.textContent='（0件）';csvReMsg.style.color='#d32f2f';return;}
        // 開始済みマージ：プログラム名 AND 予定時刻が一致したものだけ引き継ぎ
        var startedMap={};
        toArray(state.programs).forEach(function(p){
          if(p.startedAt){
            var key=p.program+'|'+p.scheduledTime;
            startedMap[key]={startedAt:p.startedAt,operatorName:p.operatorName||null};
          }
        });
        var merged=0;
        newProgs=newProgs.map(function(p){
          var key=p.program+'|'+p.scheduledTime;
          if(startedMap[key]){merged++;return Object.assign({},p,{startedAt:startedMap[key].startedAt,operatorName:startedMap[key].operatorName});}
          return p;
        });
        // stateを更新してFirebaseに保存（1回のupdで）
        var patch={programs:newProgs};
        if(changeEventName&&baseName)patch.eventName=baseName;
        upd(patch);
        if(changeEventName&&baseName)applyEventName(baseName);
        // 件数表示を更新
        if(csvReFileInp._updateCount)csvReFileInp._updateCount(newProgs.length);
        var msg='✓ '+newProgs.length+'件を読み込みました';
        if(merged>0)msg+='（開始済 '+merged+'件を引き継ぎ）';
        csvReMsg.textContent=msg;
        csvReMsg.style.color='#2e7d32';
        });
        }
        // イベント名が入力済みで異なる場合は3択で確認
        if(baseName&&state.eventName&&state.eventName.trim()&&state.eventName!==baseName){
          showConfirm(
            'CSVを読み込みます。\nイベント名もファイル名に変更しますか？\n\n変更後: '+baseName,
            function(){doLoad(true);},
            null,
            {okLabel:'イベント名も変更して読み込む',subLabel:'イベント名は変えず読み込む',subAction:function(){doLoad(false);}}
          );
        } else {doLoad(true);}
      };

    // イベントID更新ボタン
    var newIdBtn2=el('button',{className:'btn btn-danger',style:{padding:'10px 16px',fontSize:14,borderRadius:10,flexShrink:0,width:'100%',marginTop:12}},'🆕 新規イベントを作成');
    newIdBtn2.onclick=function(){
      showConfirm('新規イベントを作成します。\n\n・イベント名・CSV・進行状況がすべてクリアされます\n・現在のFirebaseデータは削除されません',function(){
        try{localStorage.removeItem('evtm_current_event');}catch(e){}
        clearTimers();
        mountEventList();
      });
    };

    // Recovery
    var recInp=el('input',{className:'recovery-inp',placeholder:'Event ID を入力'});
    var recBtn=el('button',{className:'btn btn-primary',style:{flexShrink:'0',padding:'9px 14px',fontSize:13}},'復帰');
    recBtn.onclick=function(){
      var id=recInp.value.trim();if(!id){alert('IDを入力してください');return;}
      recBtn.disabled=true;recBtn.textContent='読込中…';
      dbLoad(id,function(err,s){
        recBtn.disabled=false;recBtn.textContent='復帰';
        if(err||!s){alert('イベントが見つかりません: '+(err?err.message:id));return;}
        clearTimers();mountMain(s,role,opKey);
      });
    };

    // ── 実績エクスポート ──
    var exportBtn=el('button',{className:'btn btn-primary',style:{width:'100%'}},'📊 実績データをCSVエクスポート');
    exportBtn.onclick=function(){
      var ps=toArray(state.programs);
      var started=ps.filter(function(p){return p.startedAt;});
      if(!started.length){showSnackbar('開始済みのプログラムがありません');return;}

      function parseMs(timeStr){
        if(!timeStr)return null;
        var p=timeStr.split(':');
        return (+p[0])*3600000+(+p[1])*60000;
      }

      // BOM付きUTF-8 CSV
      var lines=['\uFEFF'+'プログラム,対象,予定時刻,実績開始時刻,差分(分),担当者,登録種別'];
      ps.forEach(function(p){
        var actual=p.startedAt?fmtISO(p.startedAt):'';
        var diff='';
        if(p.startedAt&&p.scheduledTime){
          var dMs=parseMs(fmtISO(p.startedAt))-parseMs(p.scheduledTime);
          if(!isNaN(dMs))diff=Math.round(dMs/60000);
        }
        var kind=!p.startedAt?'未登録':p.isEstimated?'予測':'実績';
        lines.push([
          p.program||'',
          p.target||'',
          p.scheduledTime||'',
          actual,
          diff,
          p.isEstimated?'（予測登録）':(p.operatorName||''),
          kind,
          p.isFeatured?(p.featuredNote||'★'):''
        ].join(','));
      });

      var blob=new Blob([lines.join('\n')],{type:'text/csv;charset=utf-8'});
      var a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download=(state.eventName||'event')+'_実績.csv';
      document.body.appendChild(a);a.click();document.body.removeChild(a);
      setTimeout(function(){URL.revokeObjectURL(a.href);},3000);
      showSnackbar('エクスポート完了（'+started.length+'件の実績）');
    };

    setupTabEl=el('div',null,[
      el('div',{className:'card'},[
        el('div',{className:'section-title'},'イベント設定'),
        el('div',{style:{marginBottom:12}},[el('div',{className:'field-label'},'イベント名（必須）'),
          el('input',{className:'field-inp',id:'setup-eventname-inp',type:'text',value:state.eventName,readOnly:true,style:{background:'#f8f7ff',borderRadius:'8px 8px 0 0'}}),
        ]),
        el('div',null,[el('div',{className:'field-label'},'あなたの名前'),
          el('input',{className:'field-inp',type:'text',value:state.adminName||'',readOnly:true,style:{background:'#f8f7ff',borderRadius:'8px 8px 0 0'}}),
        ]),
        el('div',{style:{marginTop:12}},[
          (function(){
            var progCountEl=el('div',{style:{fontSize:13,color:state.programs&&state.programs.length?'#2e7d32':'#94a3b8',fontWeight:'600',marginBottom:8}},(state.programs&&state.programs.length)?'✓ プログラム '+state.programs.length+'件':'（プログラム未設定）');
            // csvReFileInpのonchangeでこの要素を更新できるよう外部に公開
            csvReFileInp._updateCount=function(n){
              progCountEl.textContent='✓ プログラム '+n+'件';
              progCountEl.style.color='#2e7d32';
            };
            return progCountEl;
          })(),
          csvReBtn,csvReFileInp,csvReMsg,
        ]),
        el('div',{style:{marginTop:14}},[
          el('div',{className:'field-label'},'イベントID'),
          el('div',{style:{fontFamily:'monospace',fontSize:14,color:'#5b4fcf',background:'#f0eef8',borderRadius:8,padding:'8px 12px',marginTop:4,letterSpacing:'1px',wordBreak:'break-all'}},state.eventId),
        ]),
        newIdBtn2,
      ]),
      el('div',{className:'card'},[
        el('div',{className:'section-title'},'共有'),
        el('div',{className:'btn-grid'},[
          el('button',{className:'btn btn-primary',onclick:function(){showShareModal('閲覧用URL',viewUrl,'閲覧のみ可（開始・編集不可）');}},'👁 閲覧URL共有'),
          el('button',{className:'btn btn-primary',onclick:function(){showShareModal('オペレータ用URL',opUrl,'開始・時間修正ができます（管理画面は閲覧不可）');}},'⚙️ オペレータURL共有'),
        ]),
        el('div',{className:'btn-grid',style:{marginTop:8}},[
          el('button',{className:'btn btn-outline',onclick:function(){
            var manageUrl=getBase()+'#manage:'+state.eventId;
            showShareModal('管理者リンク',manageUrl,'このリンクを開くと管理者画面（準備・進行両方）に入れます');
          }},'👑 管理者リンク共有'),
          el('button',{className:'btn btn-outline',onclick:function(){
            showShareModal('イベントID',state.eventId,'スキャン後「イベント復帰」欄に入力して参加できます');
          }},'🔑 イベントID共有'),
        ]),
      ]),
      el('div',{className:'card'},[
        el('div',{className:'section-title'},'実績エクスポート・履歴保存'),
        el('div',{style:{fontSize:12,color:'var(--ink3)',marginBottom:12,lineHeight:'1.7'}},[
          '予定時刻・実績開始時刻・差分をCSVで書き出します。',el('br'),
          '次回のプログラム編成にお役立てください。',
        ]),
        exportBtn,
        (function(){
          var hSaveBtn=el('button',{className:'btn btn-outline',style:{width:'100%',marginTop:8}},'📋 この内容を履歴として保存');
          hSaveBtn.onclick=function(){
            showConfirm('現在の進行状況を履歴として保存しますか？',function(){
              hSaveBtn.disabled=true;hSaveBtn.textContent='保存中…';
              saveHistory(state,function(){
                hSaveBtn.disabled=false;hSaveBtn.textContent='📋 この内容を履歴として保存';
                showSnackbar('✓ 履歴に保存しました');
              });
            });
          };
          return hSaveBtn;
        })(),
      ]),
      el('div',{className:'card'},[
        el('div',{className:'csv-info'},[
          el('b',null,'CSVの形式'),el('br'),
          '1行目：ヘッダー行（自動スキップ）',el('br'),
          '2行目以降：時刻,対象,プログラム名[,注目メモ]（例）',el('br'),
          '08:20,全校,開会式',el('br'),'08:30,全校,準備運動',el('br'),
          '08:40,全校,応援合戦',el('br'),'08:50,中学年,団体競技',
          el('br'),el('span',{style:{color:'#2e7d32',fontSize:11}},'※ UTF-8 / Shift-JIS 両対応'),
        ]),
      ]),
      el('div',{className:'card'},[
        el('div',{className:'section-title'},'イベント復帰（ID入力）'),
        el('div',{className:'recovery-row'},[recInp,recBtn]),
        el('div',{style:{fontSize:10,color:'#94a3b8',marginTop:6}},'Event ID: '+state.eventId),
      ]),
    ]);
    return setupTabEl;
  }

  // スナックバー
  function showSnackbar(msg){
    var sb=el('div',{style:{position:'fixed',bottom:24,left:'50%',transform:'translateX(-50%)',background:'#323232',color:'white',padding:'12px 20px',borderRadius:8,fontSize:13,fontWeight:'600',zIndex:200,whiteSpace:'nowrap',boxShadow:'0 4px 12px rgba(0,0,0,.3)'}},msg);
    document.body.appendChild(sb);
    setTimeout(function(){if(document.body.contains(sb))document.body.removeChild(sb);},3000);
  }

  // ── Progress Tab ──
  var progTabEl=null;
  var progList=null;
  var pauseBtn=null,emergBtn=null,resetBtn=null,emergBanner=null,clearBtn=null;
  var filterFeatured=false; // 注目イベントフィルタ

  function buildProgressTab(){
    var ctrl=canEdit?el('div',{className:'ctrl-row'},[]):null;
    if(canEdit){
      pauseBtn=el('button',{className:'btn btn-amber',style:{display:'inline-flex',alignItems:'center',gap:6,padding:'13px 20px',fontSize:'16px'}},'一時停止');
      emergBtn=el('button',{className:'btn btn-danger',style:{padding:'13px 20px',fontSize:'16px'}},'緊急停止');
      resetBtn=el('button',{className:'btn btn-green',style:{display:'none'}},'復旧完了');
      clearBtn=el('button',{className:'btn btn-gray',style:{padding:'13px 16px',fontSize:'15px',color:'#475569',background:'#e2e8f0'}},'クリア');
      pauseBtn.onclick=function(){upd({isPaused:!state.isPaused});};
      emergBtn.onclick=function(){
        showConfirm('緊急停止しますか？\n閲覧者に緊急停止を配信します。',function(){
          upd({isEmergency:true,isPaused:false});
          showSnackbar('緊急停止を配信しました');
        });
      };
      resetBtn.onclick=function(){
        upd({isEmergency:false});
        showSnackbar('運営を再開しました');
      };
      clearBtn.onclick=function(){
        var ps=toArray(state.programs);
        var startedCount=ps.filter(function(p){return p.startedAt;}).length;
        if(!startedCount){showSnackbar('開始済みのプログラムがありません');return;}
        showConfirm('開始済み '+startedCount+'件をすべてクリアします。',function(){
          clearBtn.disabled=true;clearBtn.textContent='⏳ クリア中…';

          // ── 1) Firebaseのstartedが入っているパスを直接nullセット（フィールド削除）──
          var pathUpdates={};
          ps.forEach(function(p,i){
            pathUpdates['events/'+state.eventId+'/programs/'+i+'/startedAt']=null;
            pathUpdates['events/'+state.eventId+'/programs/'+i+'/operatorName']=null;
          });
          _db.ref().update(pathUpdates);

          // ── 2) 完全にクリーンな配列を作ってローカルstateを直接書き換え ──
          var cleared=ps.map(function(p){
            return {id:p.id||uid(),scheduledTime:p.scheduledTime||'',
              target:p.target||'',program:p.program||'',
              // 注目メモは進行クリアでも保持する
              isFeatured:p.isFeatured||false,
              featuredNote:p.featuredNote||'',
              featuredAt:p.featuredAt||null};
          });
          state=Object.assign({},state,{programs:cleared,isPaused:false,isEmergency:false,_t:Date.now()});

          // ── 3) 即座に再描画 ──
          try{renderPrograms();}catch(e){console.error(e);}
          try{refreshStatusBar();}catch(e){}

          // ── 4) Firebaseに完全な新stateを保存 ──
          dbSave(state.eventId,state,function(err){
            clearBtn.disabled=false;clearBtn.textContent='クリア';
            if(err){showSnackbar('保存エラー: '+err.message);}
            else{showSnackbar('✓ 進行クリア完了（'+startedCount+'件）');}
          });
        });
      };
      // 注目フィルタボタン
      var filterBtn=el('button',{className:'btn btn-gray',style:{marginLeft:'auto',fontSize:13,padding:'8px 14px'}},
        '☆ 注目のみ表示');
      filterBtn.onclick=function(){
        filterFeatured=!filterFeatured;
        filterBtn.textContent=filterFeatured?'★ 全て表示':'☆ 注目のみ表示';
        filterBtn.style.background=filterFeatured?'#fef3c7':'';
        filterBtn.style.color=filterFeatured?'#92400e':'';
        filterBtn.style.borderColor=filterFeatured?'#f59e0b':'';
        renderPrograms();
      };
      ctrl.appendChild(pauseBtn);ctrl.appendChild(emergBtn);ctrl.appendChild(resetBtn);ctrl.appendChild(clearBtn);
      ctrl.appendChild(filterBtn);
    }

    // 緊急停止バナー（進行エリア内）
    var emergMsg=canEdit
      ? '緊急停止中：配信を一時停止しています（復旧完了で解除）。'
      : '緊急停止中：復旧が完了次第再開されます。';
    emergBanner=el('div',{style:{display:'none',background:'#c62828',color:'white',borderRadius:10,padding:'12px 16px',marginBottom:14,fontWeight:'700',fontSize:14,lineHeight:'1.6'}},
      emergMsg
    );

    progList=el('div',null,'');

    var opNameRow=canEdit?el('div',{style:{marginBottom:10}},[
      el('div',{className:'field-label',style:{fontSize:14}},'担当者名'),
      (function(){var i=el('input',{className:'field-inp',type:'text',placeholder:'運営管理者',style:{background:'#f8f7ff',borderRadius:'8px 8px 0 0'}});i.value=opName||'運営管理者';i.oninput=function(){opName=i.value;};return i;})(),
    ]):null;

    progTabEl=el('div',null,[
      el('div',{className:'prog-header'},[
        el('div',{className:'prog-title',id:'prog-title-el'},'進行（'+state.eventName+'）'),
        ctrl||'',
      ]),
      opNameRow||'',
      emergBanner,
      progList,
    ]);
    return progTabEl;
  }

  // ── 注目イベントの登録・更新 ──
  function doFeatured(pid, note){
    upd({programs:toArray(state.programs).map(function(p){
      if(p.id!==pid)return p;
      var nowFeatured=!p.isFeatured;
      return Object.assign({},p,{isFeatured:nowFeatured,featuredNote:nowFeatured?(note||''):'',featuredAt:nowFeatured?new Date().toISOString():null});
    })});
  }

  function renderPrograms(){
    if(!progList)return;
    progList.innerHTML='';
    var progs=estimateAll(state.programs||[]);

    // 注目フィルタが有効な場合は注目イベントのみ表示
    if(filterFeatured){
      var featuredProgs=progs.filter(function(p){return p.isFeatured;});
      if(featuredProgs.length===0){
        progList.appendChild(el('div',{style:{padding:'32px 18px',color:'var(--ink3)',fontSize:14,textAlign:'center'}},'注目イベントはありません'));
        return;
      }
      // 注目イベントのみをフラットに表示（セクション区切りなし）
      progList.appendChild(el('div',{className:'section-label'},'★ 注目イベント（'+featuredProgs.length+'件）'));
      featuredProgs.forEach(function(p){
        var isDone=p.status==='started';
        var rowCls='prog-row featured-row';
        var row=el('div',{className:rowCls,style:{cursor:'pointer'}});
        row.onclick=function(e){
          if(e.target.classList&&e.target.classList.contains('featured-star'))return;
          showFeaturedDetail(p);
        };
        var dot=el('div',{className:'prog-btn-col'});
        dot.appendChild(el('span',{style:{fontSize:22,color:'#f59e0b',lineHeight:'1'}},'★'));
        var info=el('div',{className:'prog-info'});
        info.appendChild(el('div',{className:'prog-sched'},p.scheduledTime||'--:--'));
        info.appendChild(el('div',{className:'prog-name',style:{color:'#92400e'}},p.program));
        if(p.target)info.appendChild(el('div',{className:'prog-target'},p.target));
        if(p.featuredNote)info.appendChild(el('div',{style:{fontSize:12,color:'#92400e',marginTop:3}},p.featuredNote));
        var right=el('div',{className:'time-right'});
        right.appendChild(el('span',{className:'time-label'},isDone?'開始':'予測'));
        right.appendChild(el('div',{className:'time-val',style:{color:isDone?'#2e7d32':'var(--ink)'}},isDone?fmtISO(p.startedAt):(p._est||'--:--')));
        var starBtn=el('button',{className:'featured-star on'});
        starBtn.textContent='★';
        if(canEdit)(function(prog){starBtn.onclick=function(e){e.stopPropagation();showFeaturedRegister(prog);};})(p);
        row.appendChild(dot);row.appendChild(info);row.appendChild(right);row.appendChild(starBtn);
        progList.appendChild(row);
      });
      return; // フィルタ中は以降の通常描画をスキップ
    }
    var progs=estimateAll(state.programs||[]);

    // 最後の開始済みインデックスを特定
    var lastDoneIdx=progs.reduce(function(a,p,i){return p.status==='started'?i:a;},-1);
    // 最初の未開始インデックス
    var firstNextIdx=-1;
    progs.forEach(function(p,i){if(p.status!=='started'&&firstNextIdx<0)firstNextIdx=i;});

    var doneSectionAdded=false,nextSectionAdded=false,upcomingSectionAdded=false;

    progs.forEach(function(p,i){
      var isDone=p.status==='started';
      var isNext=!isDone&&i===firstNextIdx;
      var isUpcoming=!isDone&&!isNext;

      // セクションラベル
      if(isDone&&!doneSectionAdded){
        progList.appendChild(el('div',{className:'section-label'},'開始済み'));
        doneSectionAdded=true;
      }
      if(isNext&&!nextSectionAdded){
        progList.appendChild(el('div',{className:'section-label'},'次の試合'));
        nextSectionAdded=true;
      }
      if(isUpcoming&&!upcomingSectionAdded){
        progList.appendChild(el('div',{className:'section-label'},'以降'));
        upcomingSectionAdded=true;
      }

      var rowCls='prog-row '+(isDone?(p.isEstimated?'done-row estimated-row':'done-row'):isNext?'next-row':'');
      if(p.isFeatured)rowCls+=' featured-row';
      var row=el('div',{className:rowCls.trim(),style:{cursor:p.isFeatured?'pointer':''}});
      // 注目イベントはタップで詳細モーダルを表示
      if(p.isFeatured){
        row.onclick=function(e){
          if(e.target.classList&&e.target.classList.contains('featured-star'))return;
          showFeaturedDetail(p);
        };
      }

      // ── 左列：ボタン ──
      var leftCol=el('div',{className:'prog-btn-col'});
      if(isDone){
        var ck=el('div',{className:'check-mark'},'✓');
        if(canEdit){ck.onclick=function(){showEditDialog(p,canEdit,function(){doCancel(p.id);},function(t){doEditTime(p.id,t);});};}
        else{ck.style.cursor='default';}
        leftCol.appendChild(ck);
      } else if(canEdit&&!state.isPaused&&!state.isEmergency){
        var sb=el('button',{className:'start-btn'},'▶');
        (function(pid,pname,sched){sb.onclick=function(){showStartConfirm(pname,sched,function(t){doStart(pid,t);});};})(p.id,p.program,p.scheduledTime);
        leftCol.appendChild(sb);
      } else if(canEdit){
        var pb=el('button',{className:'start-btn paused-state'},'▶');
        pb.disabled=true;
        leftCol.appendChild(pb);
      }

      // ── 中列：情報 ──
      var info=el('div',{className:'prog-info'});
      info.appendChild(el('div',{className:'prog-sched'},p.scheduledTime||'--:--'));
      info.appendChild(el('div',{className:'prog-name'},p.program));
      if(p.target)info.appendChild(el('div',{className:'prog-target'},p.target));
      // 注目バッジ
      if(p.isFeatured){
        var fbRow=el('div',{style:{display:'flex',alignItems:'center',gap:6,marginTop:3}});
        fbRow.appendChild(el('span',{className:'featured-badge'},'★ 注目'));
        if(p.featuredNote)fbRow.appendChild(el('span',{style:{fontSize:11,color:'#92400e',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:'120px'}},p.featuredNote));
        info.appendChild(fbRow);
      }
      if(isDone&&p.startedAt){
        var metaStr=fmtISO(p.startedAt);
        if(p.isEstimated){
          var metaRow=el('div',{style:{display:'flex',alignItems:'center',gap:6,marginTop:2}});
          metaRow.appendChild(el('span',{className:'started-meta'},metaStr));
          metaRow.appendChild(el('span',{style:{fontSize:10,color:'var(--accent)',fontWeight:700,
            border:'1px solid var(--accent)',borderRadius:4,padding:'1px 5px',letterSpacing:'.04em'}},'予測'));
          info.appendChild(metaRow);
        } else {
          var meta=metaStr+(p.operatorName?' ('+p.operatorName+')':'');
          info.appendChild(el('div',{className:'started-meta'},meta));
        }
      }

      // ── 右列：時刻 ──
      var right=el('div',{className:'time-right'});
      if(isDone){
        right.appendChild(el('span',{className:'time-label'},'開始'));
        right.appendChild(el('div',{className:'time-val'},fmtISO(p.startedAt)||'--:--'));
        if(p.scheduledTime){
          var diff=Math.round((parseTimeToMs(fmtISO(p.startedAt))-parseTimeToMs(p.scheduledTime))/60000);
          if(!isNaN(diff)&&diff!==0){
            var tag=el('span',{className:diff>0?'delay-tag':'early-tag'},(diff>0?'+':'')+diff+'分');
            right.appendChild(tag);
          }
        }
      } else {
        right.appendChild(el('span',{className:'time-label'},'予測'));
        right.appendChild(el('div',{className:'time-val'},p._est||'--:--'));
        // 差分を小さく補足表示
        if(p._est&&p.scheduledTime){
          var dMs=parseTimeToMs(p._est)-parseTimeToMs(p.scheduledTime);
          if(!isNaN(dMs)){
            var diffMin=Math.round(dMs/60000);
            if(diffMin===0){
              right.appendChild(el('span',{style:{fontFamily:'var(--mono)',fontSize:11,color:'var(--ink3)',display:'block',textAlign:'right',marginTop:2}},'定刻'));
            } else {
              var sign=diffMin>0?'+':'';
              var col=diffMin>0?'var(--accent)':'#2e7d32';
              right.appendChild(el('span',{style:{fontFamily:'var(--mono)',fontSize:12,color:col,display:'block',textAlign:'right',marginTop:2,fontWeight:'700'}},sign+diffMin+'分'));
            }
          }
        }
      }

      row.appendChild(leftCol);
      row.appendChild(info);
      row.appendChild(right);
      // ★ 注目登録ボタン（管理者・オペレータのみ）
      if(canEdit){
        var starBtn=el('button',{className:'featured-star '+(p.isFeatured?'on':'')});
        starBtn.textContent=p.isFeatured?'★':'☆';
        starBtn.title=p.isFeatured?'注目イベント登録済み（タップで編集/解除）':'注目イベントに登録';
        (function(prog){starBtn.onclick=function(e){e.stopPropagation();showFeaturedRegister(prog);};})(p);
        row.appendChild(starBtn);
      }
      progList.appendChild(row);
    });
  }

  function refreshStatusBar(){
    var curIdx=(state.programs||[]).reduce(function(a,p,i){return p.status==='started'?i:a;},-1);
    if(state.isEmergency){statusDot.className='status-dot emergency';statusText.textContent='緊急停止中';}
    else if(state.isPaused){statusDot.className='status-dot paused';statusText.textContent='一時停止中';}
    else if(curIdx>=0){statusDot.className='status-dot running';statusText.textContent='進行中';}
    else{statusDot.className='status-dot waiting';statusText.textContent='開始待機';}

    // イベント名を全表示箇所に反映（常に最新stateから）
    var titleText='進行（'+(state.eventName||'')+'）';
    var ptEl=document.getElementById('prog-title-el');
    if(ptEl)ptEl.textContent=titleText;
    var atEl=document.getElementById('appbar-title-el');
    if(atEl)atEl.textContent=state.eventName||'イベントNow！';

    // 緊急停止バナー
    if(emergBanner){emergBanner.style.display=state.isEmergency?'block':'none';}

    // 一時停止オーバーレイ（緊急停止とは別）
    overlayEl.style.display=state.isPaused?'block':'none';
    if(state.isPaused){overlayEl.className='paused-overlay';overlayEl.textContent='⏸ 一時停止中';}

    if(pauseBtn){
      pauseBtn.textContent=state.isPaused?'▶ 再開':'一時停止';
      pauseBtn.style.display=state.isEmergency?'none':'';
      pauseBtn.style.background=state.isPaused?'#2e7d32':'#ed6c02';
    }
    if(emergBtn)emergBtn.style.display=state.isEmergency?'none':'';
    if(resetBtn)resetBtn.style.display=state.isEmergency?'':'none';
  }

  // ── Tab switching ──
  function scrollToNext(){
    setTimeout(function(){
      // documentレベルで探す（windowスクロール環境対応）
      var labels=Array.from(document.querySelectorAll('.section-label'));
      var target=labels.find(function(el){return el.textContent.indexOf('次の試合')>=0;});
      if(!target)return;
      var rect=target.getBoundingClientRect();
      // sticky header合計高さ(appbar+tabs+statusbar≈140px)を引いた位置へ
      window.scrollBy({top:rect.top-140,behavior:'smooth'});
    },200);
  }

  function switchTab(tab){
    activeTab=tab;
    content.innerHTML='';
    if(tab==='setup'){
      tabSetup&&(tabSetup.className='tab active');tabProg&&(tabProg.className='tab');
      content.appendChild(buildSetupTab());
    } else {
      tabProg&&(tabProg.className='tab active');tabSetup&&(tabSetup.className='tab');
      if(!progTabEl)buildProgressTab();
      content.appendChild(progTabEl);
      renderPrograms();refreshStatusBar();
    }
  }

  tabSetup&&(tabSetup.onclick=function(){switchTab('setup');});
  tabProg&&(tabProg.onclick=function(){
    switchTab('progress');
    scrollToNext();
  });

  // ── Mutations ──
  function upd(patch){
    state=Object.assign({},state,patch,{_t:Date.now()});
    if(state.programs)state.programs=toArray(state.programs);
    dbSave(state.eventId,state,function(err){if(err)alert('保存エラー: '+err.message);});
    if(activeTab==='progress'){renderPrograms();refreshStatusBar();}
  }
  function doStart(pid,timeStr){
    var name=opName.trim()||state.adminName||'（未入力）';
    var d=new Date();
    if(timeStr){var parts=timeStr.split(':');d=new Date();d.setHours(+parts[0],+parts[1],0,0);}

    var progs=toArray(state.programs);
    var curIdx=progs.findIndex(function(p){return p.id===pid;});

    // 最後に実績登録されたインデックスを探す（予測登録は除く）
    var lastRealIdx=-1,lastRealTime=null;
    progs.forEach(function(p,i){if(p.startedAt&&!p.isEstimated&&i<curIdx){lastRealIdx=i;lastRealTime=new Date(p.startedAt);}});

    // 間にある未登録プログラム数をカウント
    var gapIdxs=[];
    for(var i=lastRealIdx+1;i<curIdx;i++){if(!progs[i].startedAt)gapIdxs.push(i);}

    var autoCount=0;
    var newProgs=progs.slice();

    if(gapIdxs.length>0&&lastRealTime){
      // 「最後の実績時刻」と「今回の登録時刻」を均等に分割
      // 区間数 = gap件数 + 1（最後の実績→1件目→…→今回登録、の各区切り）
      var totalMs=d.getTime()-lastRealTime.getTime();
      var step=totalMs/(gapIdxs.length+1);
      gapIdxs.forEach(function(idx,j){
        var t=new Date(lastRealTime.getTime()+step*(j+1));
        newProgs[idx]=Object.assign({},progs[idx],{
          status:'started',startedAt:t.toISOString(),
          operatorName:'（予測登録）',isEstimated:true
        });
        autoCount++;
      });
    }

    // 今回登録するプログラム
    newProgs[curIdx]=Object.assign({},progs[curIdx],{
      status:'started',startedAt:d.toISOString(),
      operatorName:name,isEstimated:false
    });

    upd({programs:newProgs});
    if(autoCount>0)showSnackbar(autoCount+'件を均等割の予測時刻で自動登録しました');
  }
  function doCancel(pid){upd({programs:state.programs.map(function(p){return p.id===pid?Object.assign({},p,{status:'pending',startedAt:null,operatorName:null}):p;})});}
  function doEditTime(pid,newTime){
    var now=new Date();var d=new Date(now);
    var parts=newTime.split(':');d.setHours(+parts[0],+parts[1],0,0);
    upd({programs:state.programs.map(function(p){return p.id===pid?Object.assign({},p,{startedAt:d.toISOString()}):p;})});
  }

  // ── Firebase realtime ──
  dbListen(state.eventId,function(fresh){
    if(!fresh)return;
    if(fresh.programs)fresh.programs=toArray(fresh.programs);
    // ローカルの最新 _t より古いFirebaseデータは無視（upd()後の上書き防止）
    if((fresh._t||0) < (state._t||0))return;
    if(JSON.stringify(fresh)!==JSON.stringify(state)){
      state=fresh;
      if(activeTab==='progress'){
        try{renderPrograms();}catch(e){console.error('renderPrograms error',e);}
        try{refreshStatusBar();}catch(e){console.error('refreshStatusBar error',e);}
      }
    }
  });
  _ck=setInterval(function(){tickClock();var hc=document.getElementById("hdr-clock");if(hc)hc.textContent=fmtDate(new Date());},15000);

  render(root);
  switchTab(activeTab);
  // 進行タブで開始時は「次の試合」へスクロール（閲覧URL・イベント切替を含む）
  if(activeTab==='progress')scrollToNext();
}

function getEventsList(){try{return JSON.parse(localStorage.getItem(EVT_LIST_KEY)||'[]');}catch(e){return[];}}

  var list=getEventsList();
  var idx=list.findIndex(function(e){return e.eventId===meta.eventId;});
  var entry=Object.assign({lastUpdated:Date.now()},meta);
  if(idx>=0)list[idx]=entry; else list.unshift(entry);
  localStorage.setItem(EVT_LIST_KEY,JSON.stringify(list.slice(0,10)));
  localStorage.setItem(EVT_ACTIVE_KEY,meta.eventId);

  var list=getEventsList().filter(function(e){return e.eventId!==eventId;});
  localStorage.setItem(EVT_LIST_KEY,JSON.stringify(list));
  if(localStorage.getItem(EVT_ACTIVE_KEY)===eventId)localStorage.removeItem(EVT_ACTIVE_KEY);
}

// 現在のイベントをFirebaseに履歴として保存
function saveHistory(state,onDone){
  var histId=state.eventId+'_'+Date.now();

    histId:histId,eventId:state.eventId,eventName:state.eventName,
    adminName:state.adminName,savedAt:new Date().toISOString(),
    programs:toArray(state.programs)
  };
  _db.ref(HIST_DB_PATH+'/'+histId).set(snap,function(err){

    addHistoryMeta({histId:histId,eventName:state.eventName,savedAt:snap.savedAt,eventId:state.eventId});
    if(onDone)onDone(null);
  });
}

}

// 履歴からCSVエクスポート
function exportHistoryCsv(data){
  function parseMs(t){if(!t)return 0;var p=t.split(':');return(+p[0])*3600000+(+p[1])*60000;}
  var progs=toArray(data.programs);
  var lines=['\uFEFF'+'プログラム,対象,予定時刻,実績開始時刻,差分(分),担当者,登録種別'];
  progs.forEach(function(p){
    var actual=p.startedAt?fmtISO(p.startedAt):'';
    var diff='';
    if(p.startedAt&&p.scheduledTime){var dMs=parseMs(fmtISO(p.startedAt))-parseMs(p.scheduledTime);if(!isNaN(dMs))diff=Math.round(dMs/60000);}
    lines.push([p.program||'',p.target||'',p.scheduledTime||'',actual,diff,p.isEstimated?'（予測登録）':(p.operatorName||''),!p.startedAt?'未登録':p.isEstimated?'予測':'実績'].join(','));
  });
  var blob=new Blob([lines.join('\n')],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=(data.eventName||'event')+'_'+new Date(data.savedAt).toLocaleDateString('ja-JP').replace(/\//g,'-')+'_実績.csv';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
  showSnackbar('CSVをダウンロードしました');
}

function showSetupForm(savedData){
  var eventId   = (savedData&&savedData.eventId)  ? savedData.eventId  : uid();
  var opKey     = (savedData&&savedData.opKey)    ? savedData.opKey    : uid();
  var eventName = (savedData&&savedData.eventName)? savedData.eventName: '';
  var adminName = (savedData&&savedData.adminName)? savedData.adminName: '運営管理者';
  var programs  = (savedData&&savedData.programs) ? savedData.programs : [];

  function persistLocal(){saveEventToList({eventId:eventId,opKey:opKey,eventName:eventName||'（無題）',adminName:adminName});}

  var inpEvt=el('input',{className:'field-inp',type:'text',placeholder:'例: レディース団体戦',style:{background:'white',borderRadius:'8px 8px 0 0'}});
  inpEvt.value=eventName;inpEvt.oninput=function(){eventName=inpEvt.value;persistLocal();};

  var inpAdm=el('input',{className:'field-inp',type:'text',placeholder:'運営管理者',style:{background:'white',borderRadius:'8px 8px 0 0'}});
  inpAdm.value=adminName;inpAdm.oninput=function(){adminName=inpAdm.value;};

  var csvMsg=el('div',{style:{fontSize:13,color:'#2e7d32',fontWeight:'600',marginLeft:8}},programs.length?'✓ '+programs.length+'件':'');
  var csvBtn=el('button',{className:'btn btn-primary',style:{flexShrink:0,borderRadius:10}},'CSV取り込み');
  var fileInput=el('input',{type:'file',accept:'.csv,.txt',style:{display:'none'}});
  csvBtn.onclick=function(){fileInput.click();};
  fileInput.onchange=function(){
    var f=fileInput.files[0];if(!f)return;
    fileInput.value='';
    var baseName=f.name.replace(/\.[^.]+$/,'');
    function doAdminLoad(changeName){
      if(changeName&&baseName){eventName=baseName;inpEvt.value=baseName;persistLocal();applyEventName(baseName);}
      readCsvFile(f,function(text){
        var newProgs=csvParse(text);
        if(!newProgs.length){csvMsg.textContent='（0件）';return;}
        var startedMap={};
        toArray(programs).forEach(function(p){if(p.startedAt){var k=p.program+'|'+p.scheduledTime;startedMap[k]={startedAt:p.startedAt,operatorName:p.operatorName||null};}});
        var merged=0;
        newProgs=newProgs.map(function(p){var k=p.program+'|'+p.scheduledTime;if(startedMap[k]){merged++;return Object.assign({},p,{startedAt:startedMap[k].startedAt,operatorName:startedMap[k].operatorName});}return p;});
        programs=newProgs;persistLocal();
        csvMsg.textContent='✓ '+programs.length+'件'+(merged>0?'（開始済 '+merged+'件引き継ぎ）':'');
      });
    }
    if(baseName&&eventName&&eventName.trim()&&eventName!==baseName){
      showConfirm('CSVを読み込みます。\nイベント名もファイル名に変更しますか？\n\n変更後: '+baseName,
        function(){doAdminLoad(true);},null,
        {okLabel:'イベント名も変更して読み込む',subLabel:'イベント名は変えず読み込む',subAction:function(){doAdminLoad(false);}});
    } else {doAdminLoad(true);}
  };

  var goBtn=el('button',{className:'btn btn-primary',style:{width:'100%',borderRadius:10,padding:14,fontSize:15}},'進行管理を開始 →');
  var goMsg=el('div',{style:{fontSize:12,color:'#d32f2f',textAlign:'center',marginTop:6}});
  goBtn.onclick=function(){
    if(!eventName.trim()){showSnackbar('イベント名を入力してください');return;}
    if(!programs.length){showSnackbar('CSVからプログラムを読み込んでください');return;}
    goBtn.disabled=true;goBtn.style.opacity='.6';goBtn.textContent='保存中…';
    var state={eventId:eventId,opKey:opKey,eventName:eventName,adminName:adminName,programs:programs,isPaused:false,isEmergency:false,_t:Date.now()};
    saveEventToList({eventId:eventId,opKey:opKey,eventName:eventName,adminName:adminName});
    dbSave(eventId,state,function(err){
      if(err){goBtn.disabled=false;goBtn.style.opacity='';goBtn.textContent='進行管理を開始 →';goMsg.textContent='エラー: '+err.message;return;}
      mountMain(state,'admin',null);
    });
  };

  var backBtn=el('button',{className:'btn btn-gray',style:{width:'100%',marginBottom:8}},'← イベント一覧に戻る');
  backBtn.onclick=function(){mountEventList();};

  var inner=el('div',{style:{maxWidth:480,margin:'0 auto',paddingBottom:'32px'}});
  inner.appendChild(el('div',{className:'card'},[
    el('div',{className:'section-title'},'新規イベント設定'),
    el('div',{style:{marginBottom:14}},[el('div',{className:'field-label'},'イベント名（必須）'),inpEvt]),
    el('div',null,[el('div',{className:'field-label'},'あなたの名前'),inpAdm]),
    el('div',{style:{display:'flex',alignItems:'center',gap:8,marginTop:14}},[csvBtn,fileInput,csvMsg]),
    el('div',{style:{marginTop:14}},[el('div',{className:'field-label'},'イベントID'),el('div',{style:{fontFamily:'monospace',fontSize:13,color:'#5b4fcf',background:'#f0eef8',borderRadius:8,padding:'6px 10px',marginTop:4}},eventId)]),
  ]));
  inner.appendChild(el('div',{className:'card'},[
    el('div',{className:'csv-info'},[
          el('b',null,'CSVの形式'),el('br'),
          '列構成：時刻,対象,プログラム[,注目メモ]',el('br'),
          '例）08:20,全校,開会式,,',el('br'),
          '例）09:45,3部,3-A-1,決勝進出者注目！',el('br'),
          el('span',{style:{color:'#2e7d32',fontSize:11}},'※ 4列目に文字があると注目イベントに自動登録されます'),
        ]),
  ]));
  inner.appendChild(el('div',{className:'card'},[goBtn,goMsg]));
  inner.appendChild(el('div',{style:{padding:'0 0 8px'}},[backBtn]));

  var wrap=el('div',{style:{minHeight:'100vh',background:'var(--bg)',display:'flex',flexDirection:'column'}});
  wrap.appendChild(el('div',{className:'appbar'},[el('span',{className:'appbar-title'},'新規イベント'),el('span',{className:'appbar-right'},fmtDate(new Date()))]));
  wrap.appendChild(el('div',{style:{flex:1,overflowY:'auto'}},inner));
  render(wrap);
}

// ══ Boot ══
(function(){
  var r=parseHash();
  var cfg=loadCfg();
  function boot(){
    if(r.mode==='viewer')mountLoader(r.eventId,'viewer',null);
    else if(r.mode==='operator')mountLoader(r.eventId,'operator',r.opKey);
    else if(r.mode==='manage')mountLoader(r.eventId,'admin',null);
    else mountAdminSetup();
  }
  // HTMLに設定が埋め込まれていてlocalStorageに未保存の場合→自動取得
  if(!cfg&&__EMBEDDED_CFG__){
    try{
      saveCfg(__EMBEDDED_CFG__);
      cfg=__EMBEDDED_CFG__;
    }catch(e){}
  }
  if(!cfg){mountFbSetup(boot);return;}
  if(!initFb(cfg)){localStorage.removeItem(fbCfgKey());mountFbSetup(boot);return;}
  boot();
})();
</script>
</body>
</html>
